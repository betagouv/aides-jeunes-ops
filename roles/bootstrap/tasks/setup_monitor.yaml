---
- name: Set monitor variables
  ansible.builtin.set_fact:
    monitor_service: monitor_service
    monitor_folder: /home/{{ server_user_name }}/monitor
    monitor_filename: monitor-server.mjs
    monitor_config_filename: monitor-config.json
- name: Create directory for monitor service
  ansible.builtin.file:
    path: "{{ monitor_folder }}"
    state: directory
    mode: "0755"
    owner: "{{ server_user_name }}"
    group: "{{ server_user_group }}"
- name: Copy monitoring server file
  ansible.builtin.template:
    src: templates/monitor/monitor-server.mjs
    dest: "{{ monitor_folder }}/{{ monitor_filename }}"
    owner: "{{ server_user_name }}"
    group: "{{ server_user_group }}"
    mode: "0755"
# 0640 : ce fichier porte l'inventaire des applications et la liste des unités
# surveillées. Il n'a qu'un lecteur, le service, et aucune raison d'être lisible
# par tout compte local de la machine.
- name: Copy monitoring server config file
  ansible.builtin.template:
    src: templates/monitor/monitor-config.json.j2
    dest: "{{ monitor_folder }}/{{ monitor_config_filename }}"
    owner: "{{ server_user_name }}"
    group: "{{ server_user_group }}"
    mode: "0640"
- name: Setup monitor service
  ansible.builtin.template:
    src: templates/monitor.service.j2
    dest: /etc/systemd/system/{{ monitor_service }}.service
    mode: "0644"
  notify: Reload systemd
# `daemon_reload` porté par la tâche elle-même : le `notify: Reload systemd`
# ci-dessus est différé jusqu'au prochain vidage de file, donc APRÈS ce
# redémarrage. Sans lui, le tour qui modifie l'unité la redémarre sur la
# définition encore en cache — une ligne `Environment=` ajoutée ici resterait
# sans effet jusqu'au déploiement suivant, en silence.
- name: Restart {{ monitor_service }}
  changed_when: false
  ansible.builtin.systemd:
    name: "{{ monitor_service }}"
    state: restarted
    enabled: true
    daemon_reload: true
