---
- name: Set application variables
  ansible.builtin.set_fact:
    application_folder: /home/{{ server_user_name }}/{{ item.name }}
    repository_folder: /home/{{ server_user_name }}/{{ item.name }}/repository
- name: Fetch application latest version
  become: true
  become_user: "{{ server_user_name }}"
  ansible.builtin.git:
    repo: "{{ item.repository }}"
    dest: "{{ repository_folder }}"
    update: true
    clone: false
    version: "{{ item.branch }}"
- name: Install npm packages and restart server
  become: true
  become_user: "{{ server_user_name }}"
  block:
    - name: Run npm ci
      ansible.builtin.command:
        chdir: "{{ repository_folder }}"
        cmd: npm ci
      changed_when: true
    - name: Run npm prestart
      ansible.builtin.command:
        chdir: "{{ repository_folder }}"
        cmd: npm run prestart
      changed_when: true
      environment:
        - NODE_ENV: production
        - MONGODB_URL: mongodb://127.0.0.1/db_{{ item.name }}
        - MES_AIDES_ROOT_URL: http{{ 's' if item.https }}://{{ item.domain }}
# Le rechargement roulant ne coûte aucune coupure tant que l'ADRESSE d'écoute ne
# change pas — mesuré : 0 réponse non-200 sur 234 sondes. C'est le cas de tous
# les déploiements ordinaires, qui ne changent que le code.
#
# Il ne sait en revanche pas changer d'adresse : le nouveau worker démarre
# pendant que l'ancien écoute encore, et en mode cluster c'est le primaire pm2
# qui détient la socket, indexée par `adresse:port`. En demander une autre
# provoque un `bind()` neuf, donc EADDRINUSE. L'issue dépend alors de
# `min_uptime` (1 s) — un démarrage plus long remet le compteur à zéro et pm2
# converge, plus court les échecs s'accumulent jusqu'à `max_restarts` et les
# workers finissent `errored`. L'application démarre en 1,2 s : 0,2 s de marge.
#
# Ce risque est borné à ce cas, et il n'est plus silencieux : l'attente
# ci-dessous fait ROUGIR le déploiement quand plus rien n'écoute, là où `pm2`
# rend 0. Si vous changez délibérément `HOST` ou `node_server_port`, passez ce
# déploiement-là en `startOrRestart`, ou faites un `pm2 delete` avant — c'est
# ainsi qu'a été faite la bascule vers la boucle locale.
- name: Pm2 restart {{ item.name }}
  become: true
  become_user: "{{ server_user_name }}"
  changed_when: true
  ansible.builtin.command: pm2 startOrReload {{ application_folder }}/pm2_config.yaml --update-env
# `pm2` rend 0 même quand tous les workers ont fini `errored` : sans cette
# attente, un démarrage qui échoue laisse le site en 502 et le déploiement au
# vert. C'est cette garde, et non le mode de redémarrage, qui empêche la panne
# d'être silencieuse.
#
# Le délai n'est pas de la prudence, c'est ce qui rend la garde utile. Sondée
# immédiatement, elle ne voit que le cas « le worker n'écoute jamais » : en mode
# cluster la socket appartient au primaire et reste ouverte tant qu'un worker
# vit, si bien qu'une application qui écoute puis meurt en boucle la satisfait à
# t=0 et n'échoue qu'ensuite, hors de vue. Mesuré : les quatre workers finissent
# `errored` vers t+9 s et la socket se ferme alors. Vingt secondes laissent
# passer la boucle de redémarrage, et l'application réelle met 1,7 s à écouter.
# Le délai écarte aussi une socket résiduelle de l'ancienne écoute.
#
# `timeout` court depuis AVANT le délai, pas après : `wait_for` prend son
# horodatage de départ puis dort. Sur 80, il reste donc 60 s de sondage réel une
# fois les 20 s écoulées.
- name: Wait for the listening socket of {{ item.name }}
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item.node_server_port }}"
    delay: 20
    timeout: 80
# `become: true` : c'est lui qui active l'escalade, et sans lui le `become_user`
# ci-dessous reste lettre morte — cette commande tournait donc sous l'utilisateur
# SSH. Conséquence observée en production — un `dump.pm2` de
# `main` daté d'avril 2025 sur une machine qui déploie en continu, et un démon
# pm2 parasite créé pour l'utilisateur de déploiement. Sans ce dump à jour, la
# resurrection au démarrage rejoue une liste de processus périmée.
- name: Pm2 save configuration for {{ item.name }}
  become: true
  become_user: "{{ server_user_name }}"
  changed_when: true
  ansible.builtin.command: pm2 save
