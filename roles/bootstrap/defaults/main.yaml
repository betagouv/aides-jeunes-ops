---
instance_name: aides-jeunes
server_user_name: main
server_user_group: aides_jeunes
# Utilisateurs ayant porté le déploiement avant `server_user_name`. Leurs
# crontabs restent en place et rejouent les mêmes tâches : on les vide.
legacy_cron_users:
  - debian
webroot_path: /var/www
is_default: false
challenge_proxy: false
node_version: "24"
# Penser à modifier le fichier install_python.yaml la ligne 6
# changed_when: "'python3.11' not in python_installed.stdout"
python_version: "3.11.4"
python_control_version: "3.11"

# Sauvegarde MongoDB
# Bases sauvegardées, une archive par base et par exécution. `db_aides_jeunes`
# est la base de production ; la preprod est reconstruite depuis la prod et
# n'est pas sauvegardée, la conserver ne ferait qu'élargir l'empreinte de
# données personnelles.
mongodb_backup_databases:
  - db_aides_jeunes
# Hors de tout arbre servi par nginx et hors du dépôt ops (/opt/mes-aides) :
# voir le commentaire de setup_mongodb_backup.yaml.
mongodb_backup_directory: /var/backups/mongodb
mongodb_backup_host: 127.0.0.1
mongodb_backup_port: 27017
# 03h30 : creux de trafic, et aucun autre travail planifié — les stats tournent
# à 02h23, l'envoi de courriels à 04h08, l'anonymisation à 05h00, certbot à
# 02h00. La sauvegarde passe donc avant l'anonymisation du jour.
mongodb_backup_on_calendar: "*-*-* 03:30:00"
# 14 jours. Le disque n'est pas le facteur limitant (1,7 To libres pour une
# archive de l'ordre du gigaoctet) ; la contrainte est le RGPD. Les archives ne
# sont pas anonymisées : elles prolongent d'autant la conservation des données
# que `tools:cleaner` efface chaque jour à 05h00. 14 jours couvre une erreur
# logique détectée après une absence prolongée sans conserver un historique que
# rien ne justifie. À arbitrer avec l'équipe et le DPD.
mongodb_backup_retention_days: 14
# Plancher de vraisemblance. mongodump réussit et retourne 0 sur une base
# inexistante ou vide, en produisant une archive de quelques centaines
# d'octets : sans ce seuil, une faute de frappe dans le nom d'une base
# produirait des sauvegardes vides pendant des mois sans un seul signal.
mongodb_backup_min_archive_bytes: 4096
# Complétude du contenu. Le script compte les documents de chaque collection
# juste avant le dump et confronte ce relevé au compte rendu de mongodump : une
# collection supprimée pendant que mongodump traite les autres produit une
# archive intègre et bien formée, mais amputée. Une collection non vide qui
# ressort à zéro est toujours refusée ; ce taux ne porte que sur le total de la
# base, pour absorber les suppressions légitimes survenues pendant le dump sans
# laisser passer une perte de masse. 90 % : `tools:cleaner` efface chaque jour à
# 05h00, bien après la sauvegarde de 03h30, et les suppressions faites par les
# usagers pendant les quelques minutes du dump se comptent sur les doigts.
mongodb_backup_min_document_ratio_percent: 90
# Filet grossier contre l'effondrement, comparé à la plus grosse archive encore
# conservée — pas à une constante, qui ne détecte que la base absente.
# Volontairement large : le contrôle fin est le recomptage des documents
# ci-dessus, celui-ci ne couvre que ce qui lui échapperait (une base tronquée
# côté mongod, un disque qui se remplit). Un seuil serré crierait sur les
# variations légitimes — une campagne d'anonymisation, une purge — et une alerte
# qui crie pour rien finit ignorée.
mongodb_backup_min_size_ratio_percent: 50

# Alerte sur unité systemd en échec
alerting_failure_service_name: alert-systemd-failure
alerting_sweep_service_name: alert-systemd-sweep
# Unités surveillées. Chacune reçoit un `OnFailure=` qui pousse un événement
# Sentry dès qu'elle tombe en échec ; le balayage quotidien vérifie en plus que
# celles marquées `expect_active` tournent bien, et la page de supervision
# publie leur état.
# `expect_active: false` pour un service déclenché par un timer : son état
# normal est « inactive », seul l'échec compte.
# Le nom doit porter son suffixe systemd. « nginx » tout court poserait le
# greffon dans /etc/systemd/system/nginx.d, que systemd ne lit pas, et l'unité
# compterait pour deux au balayage. Une vérification l'impose au déploiement.
# Ajouter une unité = deux lignes ici, rien d'autre. Une unité en échec que
# personne n'a pensé à lister est de toute façon remontée par le balayage, qui
# lit `systemctl --failed` en entier — la liste sert à ce que la simple absence
# d'une unité, elle, se voie aussi.
alerting_watched_units:
  - name: monitor_service.service
    expect_active: true
  - name: mongodb-backup.service
    expect_active: false
  - name: mongodb-backup.timer
    expect_active: true
  - name: mongod.service
    expect_active: true
  - name: nginx.service
    expect_active: true
  # Le mécanisme d'alerte se surveille lui-même : c'est la seule chose que le
  # balayage ne peut pas rattraper tout seul s'il ne tourne plus, et la page de
  # supervision devient alors le dernier témoin.
  - name: "{{ alerting_sweep_service_name }}.service"
    expect_active: false
  - name: "{{ alerting_sweep_service_name }}.timer"
    expect_active: true
# 08h15 : le balayage est le filet, pas le canal rapide — `OnFailure=` a déjà
# signalé la panne à la seconde où elle est survenue. L'heure est choisie dans
# la journée de travail pour que la relance quotidienne d'une panne persistante
# tombe quand quelqu'un est là, et après la sauvegarde de 03h30.
alerting_sweep_on_calendar: "*-*-* 08:15:00"
# Plafond d'événements par balayage. Une machine dont trente unités sont en
# échec n'a pas besoin de trente tickets : les premières suffisent à alerter,
# et le décompte complet part dans le journal.
alerting_sweep_max_events: 10
# Hôtes vers lesquels le DSN a le droit de pointer, motifs glob acceptés
# (« *.ingest.sentry.io »). Le DSN vient d'un fichier que possède l'utilisateur
# de déploiement : il décide donc où partent les journaux d'unités root que les
# alertes emportent, et permettrait d'éteindre toute la supervision en la
# redirigeant vers un puits qui répond 200.
# Liste vide = épinglage sur premier usage : le premier passage adopte l'hôte
# trouvé dans le .env, tout changement ultérieur est refusé, et le DSN déjà en
# place continue de servir. C'est le défaut parce qu'il ne suppose rien de
# l'hôte réel — il ne peut donc pas couper l'alerte en production le jour du
# déploiement. Renseigner la liste dès que l'hôte est connu : c'est plus sûr.
alerting_dsn_allowed_hosts: []
